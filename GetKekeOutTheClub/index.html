<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GetHerOutTheClub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- <body> är allt som syns på sidan -->


    <!-- kontrollbaren -->
    <div id="kontroller">

        <!-- knapp som sätter igång micken-->
        <button id="startKnapp">Starta mikrofon</button>

        <!-- rullista dät man väljer vilken mikrofon som ska användas, js skriver in namnen -->
        <label>
            Mikrofon:
            <select id="enhetsLista"></select>
        </label>

        <!-- reglage för känslighet,
         min = lägsta värde, max = högsta värde, value = startvärde -->
        <label>
            Känslighet:
            <input type="range" id="kanslighet" min="1" max="100" value="30">
        </label>


        <!-- text som visar vad som händer nu, ändras av javascript -->
        <span id="status">Inte startad</span>
    </div>


    <!-- själva spelplanen,
    där karaktären rör sig -->
    <div id="spelplan">

        <!-- NYTT: banan, en väldigt hög låda (6000px) som glider ner över skärmen
             så att det ser ut som att karaktären springer framåt -->
        <div id="bana">
            <!-- NYTT: dansgolvet, tomt från början. JavaScript fyller det med färgade rutor -->
            <div id="golv"></div>

            <!-- NYTT: barerna på sidorna, sedda uppifrån. De ligger i banan så att de glider med framåt.
                 Inifrån och ut: stolar, bardisk, gång för bartendern och bakhylla med flaskor -->
            <div id="barVanster" class="bar">
                <div class="hylla"></div>
                <div class="gang"></div>
                <div class="disk"></div>
                <div class="pallar"></div>
            </div>
            <div id="barHoger" class="bar">
                <div class="hylla"></div>
                <div class="gang"></div>
                <div class="disk"></div>
                <div class="pallar"></div>
            </div>
            <!-- målet längst fram i banan -->
            <div id="mal"></div>
        </div>

        <!--karaktären -->
        <div id="karaktar"></div>

        <div id="matare">
            <div id="matarfyllning"></div>
        </div>
    </div> <!-- här slutar #spelplan -->

    <!-- NYTT: INFO-ruta. Visas direkt när sidan laddas, JavaScript döljer den när man klickar på knappen -->
    <div id="info">
        <div id="infoRuta">
            <h1 id="infoRubrik">Get Keke Out the Club!</h1>

            <!-- SKRIV ERA EGNA INSTRUKTIONER HÄR. Varje <p> blir en egen rad. Lägg till eller ta bort fritt. -->
            <p>Keke is in a hurry.</p>
            <p>Get her out by tapping on the CD.</p>
            <p>Dont let her touch the obstacles.</p>
            <p>What are you waiting for?</p>
            <p id="infoStatus"></p>
            <button id="infoKnapp">LET´S GO!</button>
        </div>
    </div>

    <!-- NYTT: GAME OVER-popup. Är dold från början, JavaScript visar den vid krock -->
    <div id="gameOver">
        <div id="gameOverRuta">
            <h1 id="gameOverText">GAME OVER</h1>
            <button id="startOmKnapp">START OVER</button>
        </div>
    </div>


    <!-- JavaScript fil -->
    <script src="script.js"></script>


</body>

</html>
